name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Firebase Android configuration
        run: python3 tool/check_config.py android

      - name: Prepare Android project
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build demo APK
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v7
        with:
          name: LabGuard-Android-Demo
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save complete Flutter source
        uses: actions/upload-artifact@v7
        with:
          name: LabGuard-Flutter-Source
          include-hidden-files: true
          path: |
            android/
            web/
            lib/
            tool/
            .github/
            .metadata
            .gitignore
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            *.md
            database.*.json
            !android/.gradle/**
            !android/local.properties
            !android/key.properties
            !android/**/build/**
            !android/**/*.jks
            !android/**/*.keystore
          if-no-files-found: error
          retention-days: 14
